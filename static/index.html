<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solana Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0d12'/><text y='24' x='4' font-size='22' fill='%2314f195'>&#9670;</text></svg>">
<style>
  :root {
    --bg: #0a0d12; --surface: #0f1318; --border: #1d2330; --border2: #2a3142;
    --text: #e8ecf1; --muted: #7a8899; --green: #14f195; --red: #f4545c;
    --amber: #f5a623; --purple: #9945ff;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); margin: 0; padding: 24px; }
  .hub-link { display: inline-block; color: var(--muted); font-size: 12px; text-decoration: none; margin-bottom: 6px; }
  .hub-link:hover { color: var(--green); }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .title { font-size: 20px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
  input { font-family: var(--mono); background: var(--surface); border: 1px solid var(--border2); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; width: 280px; }
  .btn { font-family: var(--mono); font-size: 13px; font-weight: 500; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--purple); color: var(--bg); background: var(--purple); cursor: pointer; }
  .portfolio-bar { display: flex; gap: 40px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; }
  .portfolio-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .portfolio-stat-value { font-size: 22px; font-weight: 600; }
  .portfolio-stat-value.accent { color: var(--purple); }
  .portfolio-stat-value.warn { color: var(--amber); }
  .position-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
  .position-card.out-range { border-left-color: var(--amber); }
  .pos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .pos-title { font-size: 16px; font-weight: 600; }
  .pos-title .fee-tag { font-size: 11px; color: var(--muted); background: var(--border); padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
  .pos-title .chain-tag { font-size: 10px; color: var(--purple); background: rgba(153,69,255,0.12); padding: 2px 8px; border-radius: 4px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .range-badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .range-badge.in { background: rgba(20,241,149,0.12); color: var(--green); }
  .range-badge.out { background: rgba(245,166,35,0.12); color: var(--amber); }
  .pos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; }
  .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat-value { font-size: 15px; font-weight: 500; }
  .stat-value.dim { color: var(--muted); font-size: 12px; }
  .fees-row { background: rgba(122,136,153,0.08); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .empty-state { color: var(--muted); padding: 40px; text-align: center; }
  .error-banner { background: rgba(244,84,92,0.08); border: 1px solid rgba(244,84,92,0.25); border-radius: 8px; padding: 12px 16px; font-size: 12px; color: var(--red); margin-bottom: 20px; display: none; }
  .pos-history-toggle { cursor: pointer; color: var(--purple); font-size: 12px; margin-top: 14px; user-select: none; }
  .pos-history-panel { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .pos-history-subheader { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; }
  .range-btns { display: flex; gap: 6px; margin-bottom: 8px; }
  .range-btn { font-size: 11px; color: var(--muted); background: transparent; border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: var(--mono); }
  .range-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }
  .history-chart-wrap { position: relative; }
  .history-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 30px 0; }
  .pnl-sub { font-family: var(--mono); font-size: 12px; margin-top: 2px; }
  .pnl-pos { color: var(--green); }
  .pnl-neg { color: var(--red); }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <div class="header">
    <div>
      <a href="https://v4.lptracker.info" class="hub-link">← Hub</a>
      <div class="title">◈ Solana Tracker</div>
      <div class="subtitle">Orca Whirlpool positions · Solana</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <input id="wallet-input" placeholder="Wallet address...">
      <button class="btn" onclick="loadPositions(true)">Load</button>
    </div>
  </div>

  <div class="error-banner" id="error-banner"></div>
  <div id="portfolio"></div>
  <div id="positions"></div>

<script>
function fmtUsd(n) {
  if (n === null || n === undefined) return '—';
  return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtNum(n, decimals) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtPct(n, decimals) {
  if (n === null || n === undefined) return '—';
  return Number(n).toFixed(decimals) + '%';
}
function fmtPnl(usd, pct) {
  if (usd === null || usd === undefined) return null;
  const cls = usd >= 0 ? 'pnl-pos' : 'pnl-neg';
  const sign = usd >= 0 ? '+' : '-';
  const usdStr = sign + '$' + Math.abs(usd).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pctStr = (pct !== null && pct !== undefined) ? ` (${sign}${Math.abs(pct).toFixed(2)}%)` : '';
  return { cls, text: usdStr + pctStr };
}
function feeTierLabel(feeTierRaw) {
  return (feeTierRaw / 10000).toFixed(2) + '%';
}

function renderPortfolio(portfolio) {
  const el = document.getElementById('portfolio');
  if (!portfolio || portfolio.position_count === 0) {
    el.innerHTML = `<div class="empty-state">No open Orca Whirlpool positions found for this wallet.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="portfolio-bar">
      <div><div class="portfolio-stat-label">Total Value</div><div class="portfolio-stat-value accent">${fmtUsd(portfolio.total_value_usd)}</div></div>
      <div><div class="portfolio-stat-label">Positions</div><div class="portfolio-stat-value">${portfolio.position_count}</div></div>
      <div><div class="portfolio-stat-label">Out of Range</div><div class="portfolio-stat-value ${portfolio.out_of_range_count > 0 ? 'warn' : ''}">${portfolio.out_of_range_count} / ${portfolio.position_count}</div></div>
    </div>
  `;
}

function renderPositions(positions) {
  const el = document.getElementById('positions');
  if (!positions || positions.length === 0) { el.innerHTML = ''; return; }

  el.innerHTML = positions.map(p => {
    const sym0 = p.token0.symbol, sym1 = p.token1.symbol;
    const rangeClass = p.in_range ? '' : 'out-range';
    const badgeClass = p.in_range ? 'in' : 'out';
    const badgeText = p.in_range ? 'In Range' : 'Out of Range';
    const usdValue = fmtUsd(p.position_value_usd);
    const rangeWidthPct = ((p.price_upper - p.price_lower) / p.current_price * 100);
    const pnl = fmtPnl(p.pnl_usd, p.pnl_pct);
    const pnlLine = pnl ? `<div class="pnl-sub ${pnl.cls}">${pnl.text}</div>` : '';
    const posKey = p.position_mint;

    return `
      <div class="position-card ${rangeClass}">
        <div class="pos-header">
          <div class="pos-title">${sym0} / ${sym1}<span class="fee-tag">${feeTierLabel(p.fee_tier)}</span><span class="chain-tag">Solana</span></div>
          <span class="range-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="pos-grid">
          <div>
            <div class="stat-label">Current Holdings</div>
            <div class="stat-value">${fmtNum(p.amount0, 6)} ${sym0} + ${fmtNum(p.amount1, 6)} ${sym1}</div>
            <div class="stat-value" style="margin-top:2px;">${usdValue}</div>
            ${pnlLine}
          </div>
          <div>
            <div class="stat-label">Price Range</div>
            <div class="stat-value">${fmtNum(p.price_lower, 4)} – ${fmtNum(p.price_upper, 4)}</div>
            <div class="stat-value dim" style="margin-top:2px;">Width ${fmtPct(rangeWidthPct, 1)}</div>
          </div>
          <div>
            <div class="stat-label">Current Price</div>
            <div class="stat-value">${fmtNum(p.current_price, 4)}</div>
          </div>
          <div>
            <div class="stat-label">Est. APR (pool activity)</div>
            <div class="stat-value">${p.estimated_apr_pct === null || p.estimated_apr_pct === undefined ? '—' : fmtPct(p.estimated_apr_pct, 1)}</div>
          </div>
          <div>
            <div class="stat-label">APR (since tracked)</div>
            <div class="stat-value">${p.apr_pct === null || p.apr_pct === undefined ? '—' : fmtPct(p.apr_pct, 1)}</div>
          </div>
        </div>
        <div class="fees-row">${p.fees_available
          ? `Uncollected fees: ${fmtNum(p.uncollected_fees0, 6)} ${sym0} + ${fmtNum(p.uncollected_fees1, 6)} ${sym1}${p.uncollected_fees_usd !== null && p.uncollected_fees_usd !== undefined ? ' (' + fmtUsd(p.uncollected_fees_usd) + ')' : ''}`
          : 'Uncollected fees: unavailable for this position'}</div>

        <div class="pos-history-toggle" onclick="togglePositionHistory('${posKey}')">
          <span id="pos-history-arrow-${posKey}">▸</span> Position History
        </div>
        <div class="pos-history-panel" id="pos-history-panel-${posKey}" style="display:none;">
          <div class="range-btns" id="pos-history-btns-${posKey}">
            <button class="range-btn" onclick="setPositionHistoryRange('${posKey}', '7d', this)">7D</button>
            <button class="range-btn active" onclick="setPositionHistoryRange('${posKey}', '30d', this)">30D</button>
            <button class="range-btn" onclick="setPositionHistoryRange('${posKey}', '90d', this)">90D</button>
            <button class="range-btn" onclick="setPositionHistoryRange('${posKey}', 'all', this)">All</button>
          </div>
          <div class="history-chart-wrap" style="height:160px;"><canvas id="pos-history-chart-${posKey}"></canvas></div>

          <div class="pos-history-subheader">Pool Volume (USD)</div>
          <div class="range-btns" id="pos-volume-btns-${posKey}">
            <button class="range-btn" onclick="setPositionVolumeRange('${posKey}', '7d', this)">7D</button>
            <button class="range-btn active" onclick="setPositionVolumeRange('${posKey}', '30d', this)">30D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${posKey}', '60d', this)">60D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${posKey}', '90d', this)">90D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${posKey}', '180d', this)">180D</button>
          </div>
          <div class="history-chart-wrap" style="height:120px;"><canvas id="pos-volume-chart-${posKey}"></canvas></div>
        </div>
      </div>
    `;
  }).join('');
}

const positionPanelOpened = {};
const positionCurrentRange = {};
const positionVolumeCurrentRange = {};
const positionChartInstances = {};
const positionVolumeChartInstances = {};

function togglePositionHistory(mint) {
  const panel = document.getElementById(`pos-history-panel-${mint}`);
  const arrow = document.getElementById(`pos-history-arrow-${mint}`);
  const isOpen = panel.style.display !== 'none';
  if (isOpen) { panel.style.display = 'none'; arrow.textContent = '▸'; return; }
  panel.style.display = 'block';
  arrow.textContent = '▾';
  if (!positionPanelOpened[mint]) {
    positionPanelOpened[mint] = true;
    positionCurrentRange[mint] = '30d';
    positionVolumeCurrentRange[mint] = '30d';
    loadPositionHistory(mint, '30d');
    loadPositionVolume(mint, '30d');
  }
}

function setPositionHistoryRange(mint, range, btnEl) {
  positionCurrentRange[mint] = range;
  btnEl.parentElement.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  loadPositionHistory(mint, range);
}

function setPositionVolumeRange(mint, range, btnEl) {
  positionVolumeCurrentRange[mint] = range;
  btnEl.parentElement.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  loadPositionVolume(mint, range);
}

async function loadPositionHistory(mint, range) {
  const canvas = document.getElementById(`pos-history-chart-${mint}`);
  try {
    const res = await fetch(`/api/history/${mint}?range=${range}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    renderPositionHistoryChart(mint, canvas, data.snapshots || []);
  } catch (e) {
    if (positionChartInstances[mint]) { positionChartInstances[mint].destroy(); positionChartInstances[mint] = null; }
    canvas.style.display = 'none';
    const wrap = canvas.parentElement;
    let msg = wrap.querySelector('.history-empty');
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty'; wrap.appendChild(msg); }
    msg.textContent = 'History unavailable: ' + e.message;
  }
}

function renderPositionHistoryChart(mint, canvas, snapshots) {
  const wrap = canvas.parentElement;
  const existingMsg = wrap.querySelector('.history-empty');
  const withValue = snapshots.filter(s => s.value_usd !== undefined && s.value_usd !== null);

  if (!withValue.length) {
    if (positionChartInstances[mint]) { positionChartInstances[mint].destroy(); positionChartInstances[mint] = null; }
    canvas.style.display = 'none';
    let msg = existingMsg;
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty'; wrap.appendChild(msg); }
    msg.textContent = 'No history yet for this position in this range.';
    return;
  }
  if (existingMsg) existingMsg.remove();
  canvas.style.display = 'block';

  const labels = withValue.map(s => new Date(s.ts * 1000));
  const values = withValue.map(s => s.value_usd);

  if (positionChartInstances[mint]) positionChartInstances[mint].destroy();
  positionChartInstances[mint] = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{ label: 'Position Value (USD)', data: values, borderColor: '#9945ff',
      backgroundColor: 'rgba(153,69,255,0.08)', fill: true, tension: 0.25, pointRadius: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type: 'time', time: { tooltipFormat: 'MMM d, HH:mm' }, ticks: { color: '#7a8899', font: { size: 9 } }, grid: { color: '#1d2330' } },
        y: { ticks: { color: '#7a8899', font: { size: 9 } }, grid: { color: '#1d2330' } },
      },
      plugins: { legend: { display: false } },
    },
  });
}

async function loadPositionVolume(mint, range) {
  const canvas = document.getElementById(`pos-volume-chart-${mint}`);
  if (!canvas) return;
  try {
    const res = await fetch(`/api/pool-volume/${mint}?range=${range}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    renderPositionVolumeChart(mint, canvas, data.candles || []);
  } catch (e) {
    if (positionVolumeChartInstances[mint]) { positionVolumeChartInstances[mint].destroy(); positionVolumeChartInstances[mint] = null; }
    canvas.style.display = 'none';
    const wrap = canvas.parentElement;
    let msg = wrap.querySelector('.volume-empty');
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty volume-empty'; wrap.appendChild(msg); }
    msg.textContent = 'Volume unavailable: ' + e.message;
  }
}

function renderPositionVolumeChart(mint, canvas, candles) {
  const wrap = canvas.parentElement;
  const existingMsg = wrap.querySelector('.volume-empty');
  if (!candles.length) {
    if (positionVolumeChartInstances[mint]) { positionVolumeChartInstances[mint].destroy(); positionVolumeChartInstances[mint] = null; }
    canvas.style.display = 'none';
    let msg = existingMsg;
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty volume-empty'; wrap.appendChild(msg); }
    msg.textContent = 'No volume data available for this pool.';
    return;
  }
  if (existingMsg) existingMsg.remove();
  canvas.style.display = 'block';

  const labels = candles.map(c => new Date(c.ts * 1000));
  const values = candles.map(c => c.volume_usd);

  if (positionVolumeChartInstances[mint]) positionVolumeChartInstances[mint].destroy();
  positionVolumeChartInstances[mint] = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Pool Volume (USD)', data: values, backgroundColor: 'rgba(20,241,149,0.35)', borderColor: 'rgba(20,241,149,0.6)', borderWidth: 1 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type: 'time', time: { unit: 'day', tooltipFormat: 'MMM d' }, ticks: { color: '#7a8899', font: { size: 9 } }, grid: { color: '#1d2330' } },
        y: { ticks: { color: '#7a8899', font: { size: 9 } }, grid: { color: '#1d2330' } },
      },
      plugins: { legend: { display: false } },
    },
  });
}

function restoreOpenPositionHistories(positions) {
  for (const p of positions) {
    const mint = p.position_mint;
    if (!positionPanelOpened[mint]) continue;
    const panel = document.getElementById(`pos-history-panel-${mint}`);
    const arrow = document.getElementById(`pos-history-arrow-${mint}`);
    if (!panel) continue;
    panel.style.display = 'block';
    if (arrow) arrow.textContent = '▾';

    const range = positionCurrentRange[mint] || '30d';
    const btnsContainer = document.getElementById(`pos-history-btns-${mint}`);
    if (btnsContainer) {
      btnsContainer.querySelectorAll('.range-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.trim().toLowerCase() === range.toLowerCase());
      });
    }
    loadPositionHistory(mint, range);

    const volRange = positionVolumeCurrentRange[mint] || '30d';
    const volBtnsContainer = document.getElementById(`pos-volume-btns-${mint}`);
    if (volBtnsContainer) {
      volBtnsContainer.querySelectorAll('.range-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.trim().toLowerCase() === volRange.toLowerCase());
      });
    }
    loadPositionVolume(mint, volRange);
  }
}

async function loadPositions(bust) {
  const walletInput = document.getElementById('wallet-input').value.trim();
  const url = `/api/positions${walletInput ? '?wallet=' + encodeURIComponent(walletInput) : ''}${bust ? (walletInput ? '&' : '?') + 'bust=1' : ''}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    document.getElementById('error-banner').style.display = 'none';
    renderPortfolio(data.portfolio);
    renderPositions(data.positions);
    restoreOpenPositionHistories(data.positions || []);
  } catch (e) {
    const el = document.getElementById('error-banner');
    el.textContent = 'Could not load positions: ' + e.message;
    el.style.display = 'block';
  }
}

loadPositions(false);
setInterval(() => loadPositions(false), 90000);
</script>
</body>
</html>
